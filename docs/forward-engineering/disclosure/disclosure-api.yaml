paths:

  /api/disclosures/v1/search:
    get:
      operationId: searchDisclosures

      parameters:
        - name: disclosureId
          in: query
          required: false
          schema:
            type: string

        - name: status
          in: query
          required: false
          schema:
            type: string

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100

      responses:

        '200':
          description: Disclosure search result

        '400':
          description: Invalid request

        '500':
          description: Internal server error